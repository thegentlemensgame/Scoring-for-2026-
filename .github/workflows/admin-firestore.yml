name: Admin Firestore Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install firebase-admin
      - name: Run admin fix
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python3 admin_fix.py
